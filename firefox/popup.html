<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      width: 200px;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #181818;
    }
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      background: none;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      color: #f1f1f1;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    button:last-child {
      border-bottom: none;
    }
    button:hover {
      background: #262626;
    }
  </style>
</head>
<body>
  <button id="playlist">Playlist thumbnails</button>
  <button id="browse">Browse YT bookmarks (tree)</button>
  <button id="search">Search YT in bookmarks/history</button>
  <script src="popup.js"></script>
</body>
</html>
